[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax). dir2web is
# Unix-only, so there is no Windows target.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Extra files to bundle in every archive (alongside the auto-detected
# README and LICENSE files)
include = ["THIRD-PARTY-LICENSES"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Start the release workflow with workflow_dispatch (given a tag) instead of
# a tag push: release-plz dispatches it with the built-in GITHUB_TOKEN, which
# cannot trigger workflows through a tag push, so no personal access token is
# needed.
dispatch-releases = true
