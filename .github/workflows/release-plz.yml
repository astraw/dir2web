name: release-plz

on:
  push:
    branches:
      - main

# Each job asks for exactly what it needs. Only the built-in GITHUB_TOKEN is
# used: crates.io is reached via trusted publishing (OIDC), and the binary
# release workflow is started with workflow_dispatch, which GITHUB_TOKEN may
# trigger (unlike tag pushes).
permissions: {}

jobs:
  # Opens (or updates) a "release PR" that bumps the crate version and
  # regenerates CHANGELOG.md from the Conventional Commit history.
  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Is this push the merge of a release PR? The same test release-plz applies
  # with release_always = false: the commit belongs to a merged PR from a
  # `release-plz-` branch. Keeps ordinary pushes out of the protected
  # `release` environment, so they never wait for its approval.
  release-check:
    name: release PR merged?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is-release: ${{ steps.check.outputs.is-release }}
    steps:
      - name: Check
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branches=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.merged_at != null) | .head.ref')
          echo "Merged PR branches of $GITHUB_SHA: ${branches:-none}"
          if grep -q '^release-plz-' <<<"$branches"; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

  # When a release PR is merged, publishes the crate to crates.io, pushes the
  # vX.Y.Z tag, and starts the cargo-dist workflow (release.yml) that builds
  # the binaries and creates the GitHub release. Runs in the `release`
  # environment, the only one crates.io accepts trusted publishing from.
  release-plz-release:
    name: release-plz release
    needs: release-check
    if: needs.release-check.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the tag
      pull-requests: read # tell whether this commit comes from a release PR
      id-token: write # crates.io trusted publishing
      actions: write # dispatch release.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the binary release
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          for tag in $(echo "$RELEASES" | jq -r '.[].tag'); do
            echo "Dispatching release.yml for $tag"
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f tag="$tag"
          done
