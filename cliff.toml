# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Used by release-plz (see `changelog_config` in release-plz.toml) to
# generate CHANGELOG.md from the Conventional Commit history. Preview the
# unreleased section locally with `git cliff --unreleased`.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]
"""
# `release_link` is provided by release-plz. Only the first line of a
# commit message is used, so bodies of non-conventional commits stay out.
body = """

## [{{ version | trim_start_matches(pat="v") }}]\
    {%- if release_link -%}\
        ({{ release_link }})\
    {% endif %} \
    - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}
{%- set subject = commit.message | split(pat="\n") | first | trim -%}
{%- if commit.scope -%}
- *({{ commit.scope }})* {% if commit.breaking %}[**breaking**] {% endif %}{{ subject }}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ subject }}
{% endif -%}
{% endfor -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Keep non-conventional commits (listed under "Other").
filter_unconventional = false
# The HTML comments order the sections; they are stripped in the output.
commit_parsers = [
    { message = "^chore: release", skip = true },
    { message = "^feat", group = "<!-- 0 -->added" },
    { message = "^changed", group = "<!-- 1 -->changed" },
    { message = "^deprecated", group = "<!-- 2 -->deprecated" },
    { message = "^fix", group = "<!-- 3 -->fixed" },
    { message = "^security", group = "<!-- 4 -->security" },
    { message = "^.*", group = "<!-- 5 -->other" },
]
