[package]
name = "dir2web"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Andrew Straw <strawman@astraw.com>"]
description = "Serve a directory tree over HTTP with Apache-style indices, video thumbnails and instant transcoded HLS previews"
license = "MIT OR Apache-2.0"
repository = "https://github.com/astraw/dir2web"
readme = "README.md"
keywords = ["http", "directory-listing", "video", "hls", "ffmpeg"]
categories = ["command-line-utilities", "web-programming::http-server", "multimedia::video"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hex = "0.4.3"
libc = "0.2.189"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
